
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PANEL RAKIB STORE</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#050d18;
  color:white;
}
.header{
  padding:18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #12354a;
}
.logo{
  display:flex;
  align-items:center;
  gap:12px;
}
.logo-box{
  width:58px;height:58px;
  border:3px solid #00d9ff;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  color:#00d9ff;
}
.balance{
  border:2px solid #00e99a;
  color:#00ff9d;
  padding:12px 18px;
  border-radius:30px;
  font-weight:bold;
}
.container{padding:25px 18px 100px}
.hero{
  text-align:center;
  padding:45px 15px;
  border:1px solid #12455e;
  border-radius:25px;
  background:#071827;
}
.hero h1{
  font-size:48px;
  color:#00d9ff;
  margin:20px 0;
}
.status{
  display:inline-block;
  padding:12px 25px;
  border-radius:30px;
  background:#063c31;
  color:#00ff9d;
  font-weight:bold;
}
h2{margin-top:35px}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}
.card{
  padding:25px 15px;
  text-align:center;
  border:1px solid #12455e;
  border-radius:22px;
  background:#081322;
}
.card h3{font-size:22px}
.price{
  color:#00ff9d;
  font-size:24px;
  font-weight:bold;
  margin:15px 0;
}
.buy{
  width:100%;
  border:0;
  padding:13px;
  border-radius:25px;
  background:linear-gradient(90deg,#00c9ff,#087cff);
  color:white;
  font-size:16px;
  font-weight:bold;
}
.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:#07111e;
  border-top:1px solid #12354a;
  display:flex;
  justify-content:space-around;
  align-items:center;
}
.bottom div{
  color:#8291a5;
  text-align:center;
  font-size:13px;
}
.bottom .active{color:#00d9ff}
</style>
</head>

<body>

<div class="header">
  <div class="logo">
    <div class="logo-box">M</div>
    <div>
      <b style="font-size:20px">PANEL RAKIB</b><br>
      <span>STORE</span>
    </div>
  </div>

  <div class="balance">৳ 0.00</div>
</div>

<div class="container">

  <div class="hero">
    <span class="status">● ONLINE</span>
    <h1>STORE</h1>
    <p>🔥 Premium Digital Store 🔥</p>
  </div>

  <h2>📦 Select Package</h2>

  <div class="grid">

    <div class="card">
      <h3>1 Hour</h3>
      <div class="price">৳ 17.99</div>
      <button class="buy">PURCHASE</button>
    </div>

    <div class="card">
      <h3>2 Hours</h3>
      <div class="price">৳ 28.00</div>
      <button class="buy">PURCHASE</button>
    </div>

    <div class="card">
      <h3>3 Hours</h3>
      <div class="price">৳ 39.99</div>
      <button class="buy">PURCHASE</button>
    </div>

    <div class="card">
      <h3>4 Hours</h3>
      <div class="price">৳ 49.99</div>
      <button class="buy">PURCHASE</button>
    </div>

    <div class="card">
      <h3>5 Hours</h3>
      <div class="price">৳ 60.00</div>
      <button class="buy">PURCHASE</button>
    </div>

    <div class="card">
      <h3>6 Hours</h3>
      <div class="price">৳ 80.00</div>
      <button class="buy">PURCHASE</button>
    </div>

    <div class="card">
      <h3>7 Hours</h3>
      <div class="price">৳ 99.99</div>
      <button class="buy">PURCHASE</button>
    </div>

    <div class="card">
      <h3>8 Hours</h3>
      <div class="price">৳ 119.99</div>
      <button class="buy">PURCHASE</button>
    </div>

  </div>
</div>

<div class="bottom">
  <div class="active">🏠<br>Store</div>
  <div>📋<br>Orders</div>
  <div>➕<br>Add Fund</div>
  <div>🎧<br>Support</div>
  <div>👤<br>Profile</div>
</div>

</body>
</html>
